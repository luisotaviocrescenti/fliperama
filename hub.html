<style>
/* Layout: um gabinete de fliperama visto de frente, da altura da janela. Letreiro iluminado em cima,
   a tela de tubo no meio (onde ficam o menu e os jogos) e o painel com alavanca e botões embaixo. */
:root {
  --cab-room: #0e0b14;      /* carpete escuro do salão */
  --cab-body: #1d1828;      /* fórmica do gabinete */
  --cab-body-hi: #2b2439;
  --cab-trim: #f5c518;      /* friso amarelo, o mesmo destaque dos jogos */
  --cab-hot: #ff4f8b;
  --cab-cool: #45d4ff;
  --cab-tube: #05060a;
  --cab-phos: #f4f0e4;      /* texto de fósforo */
  --cab-dim: #9a93ad;
  --cab-sign-ink: #22122b;
  --cab-red: #e8322f;
  --cab-grey: #cfcad8;
  --cab-font-sign: "Bungee", "Arial Black", Impact, sans-serif;
  --cab-font-pixel: "Silkscreen", "Courier New", monospace;
  --cab-font-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; box-sizing: border-box; color: var(--cab-phos); font-family: var(--cab-font-ui);
  background: radial-gradient(ellipse at 50% 35%, rgba(14, 11, 20, 0) 25%, rgba(6, 5, 9, .82) 100%), var(--cab-carpet, none), var(--cab-room);
  padding-inline: 16px; padding-block: 14px 0;
  display: flex; justify-content: center;
}
#app { width: 100%; max-width: 1040px; height: 100%; min-height: 540px; display: flex; }

.cab {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--cab-body-hi), var(--cab-body) 30%);
  border: 4px solid var(--cab-trim); border-bottom: 0; border-radius: 22px 22px 0 0;
  box-shadow: 0 0 0 3px #07060a, 0 30px 80px rgba(0, 0, 0, .7);
}

/* letreiro */
.cab-marquee {
  position: relative; overflow: hidden; margin: 10px 10px 0; border-radius: 12px;
  padding: clamp(8px, 1.6vh, 16px) 16px clamp(10px, 1.8vh, 18px); text-align: center;
  background: linear-gradient(180deg, #ffe066 0%, #ffab3d 48%, #ff5d8f 100%);
  box-shadow: 0 0 0 3px #07060a, 0 0 42px rgba(255, 150, 60, .4), inset 0 0 34px rgba(255, 255, 255, .45);
}
.cab-marquee::before { /* faixas de pôr do sol do letreiro */
  content: ""; position: absolute; inset: 52% 0 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(34, 18, 43, 0) 0 6px, rgba(34, 18, 43, .16) 6px 9px);
}
.cab-mq-title {
  position: relative; margin: 0; color: var(--cab-sign-ink);
  font: 400 clamp(34px, 6.6vw, 70px)/.92 var(--cab-font-sign); letter-spacing: .05em;
  text-shadow: 0 3px 0 rgba(255, 255, 255, .5), 0 -1px 0 rgba(34, 18, 43, .4);
}
.cab-mq-sub {
  position: relative; margin: 6px 0 0; color: var(--cab-sign-ink);
  font: 700 clamp(10px, 1.3vw, 13px)/1 var(--cab-font-pixel); letter-spacing: .22em;
}

/* moldura e tubo */
.cab-bezel {
  flex: 1; min-height: 0; display: flex; margin: 12px 10px 0;
  padding: clamp(10px, 2vh, 22px) clamp(10px, 2.4vw, 28px);
  background: #09080d; border-radius: 12px 12px 4px 4px;
  box-shadow: inset 0 0 0 2px rgba(255, 79, 139, .55), inset 0 0 0 7px #09080d, inset 0 0 0 8px rgba(69, 212, 255, .35);
}
.cab-tube {
  position: relative; flex: 1; min-width: 0; overflow: hidden;
  border-radius: 3.2% / 4.6%; background: var(--cab-tube);
  box-shadow: 0 0 0 3px #000, 0 0 30px rgba(69, 212, 255, .12);
}
.cab-view { position: absolute; inset: 0; overflow: auto; container-type: size; }
.cab-glass {
  position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    linear-gradient(118deg, rgba(255, 255, 255, .08) 0%, rgba(255, 255, 255, 0) 26%),
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .24) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, .6) 100%);
  box-shadow: inset 0 0 50px rgba(0, 0, 0, .7);
}
.cab-tube.is-game .cab-glass { opacity: .5; }
.cab-view.is-off { animation: cab-off .2s ease-in forwards; }
.cab-view.is-on { animation: cab-on .32s ease-out; }
@keyframes cab-off { 0% { transform: none; filter: none; } 70% { transform: scale(1, .015); filter: brightness(3); } 100% { transform: scale(0, .01); filter: brightness(5); } }
@keyframes cab-on { 0% { transform: scale(1, .01); filter: brightness(5); } 45% { transform: scale(1, .03); filter: brightness(2); } 100% { transform: none; filter: none; } }

/* menu dentro do tubo */
.cab-menu {
  box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; justify-content: center;
  gap: clamp(10px, 4cqh, 28px); padding: clamp(14px, 4cqh, 34px) clamp(14px, 4cqw, 40px);
  font-family: var(--cab-font-pixel); text-shadow: 0 0 6px rgba(244, 240, 228, .35);
}
.cab-hud { display: flex; justify-content: space-between; gap: 12px; font-size: clamp(10px, 1.6cqw, 14px); letter-spacing: .14em; color: var(--cab-dim); }
.cab-hud b { font-weight: 700; color: var(--cab-phos); }
.cab-hud-mid { color: var(--cab-cool); text-shadow: 0 0 8px rgba(69, 212, 255, .6); }
.cab-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 3cqw, 30px); width: min(100%, 170cqh); align-self: center; }
.cab-tile {
  display: flex; flex-direction: column; align-items: stretch; gap: clamp(8px, 1.6cqh, 14px);
  background: none; border: 0; padding: 0; color: var(--cab-dim); cursor: pointer; text-align: center;
  font: 700 clamp(12px, 2.3cqw, 21px)/1 var(--cab-font-pixel); letter-spacing: .06em; text-transform: uppercase; text-shadow: inherit;
}
.cab-shot { display: block; padding: 4px; background: #000; border: 3px solid #2e2840; transition: transform .15s, border-color .15s; }
.cab-shot canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; filter: saturate(.5) brightness(.55); transition: filter .15s; }
.cab-tname::before { content: "▶ "; visibility: hidden; color: var(--cab-hot); }
.cab-tile[aria-current="true"] { color: var(--cab-trim); text-shadow: 0 0 10px rgba(245, 197, 24, .55); }
.cab-tile[aria-current="true"] .cab-shot { border-color: var(--cab-trim); transform: translateY(-4px); box-shadow: 0 0 22px rgba(245, 197, 24, .4); }
.cab-tile[aria-current="true"] canvas { filter: none; }
.cab-tile[aria-current="true"] .cab-tname::before { visibility: visible; animation: cab-blink 1s steps(1) infinite; }
.cab-tile:focus { outline: none; }
.cab-tile:focus-visible .cab-shot { outline: 2px dashed var(--cab-cool); outline-offset: 4px; }
.cab-info { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; min-height: 2.6em; }
.cab-desc { margin: 0; flex: 1 1 320px; min-width: 0; max-width: 62ch; font: 400 clamp(13px, 1.9cqw, 16px)/1.45 var(--cab-font-ui); color: var(--cab-phos); text-shadow: none; }
.cab-rec { margin: 0; display: flex; flex-direction: column; gap: 6px; text-align: right; font-size: clamp(10px, 1.5cqw, 13px); letter-spacing: .14em; color: var(--cab-dim); }
.cab-rec b { font-size: clamp(18px, 3.4cqw, 30px); letter-spacing: .04em; color: var(--cab-hot); text-shadow: 0 0 10px rgba(255, 79, 139, .55); font-variant-numeric: tabular-nums; }
.cab-press { margin: 0; text-align: center; font-size: clamp(14px, 2.6cqw, 24px); letter-spacing: .2em; color: var(--cab-trim); text-shadow: 0 0 12px rgba(245, 197, 24, .6); }
.cab-press span { animation: cab-blink 1.1s steps(1) infinite; }
.cab-keys { margin: -6px 0 0; text-align: center; font-size: clamp(9px, 1.4cqw, 12px); letter-spacing: .14em; color: var(--cab-dim); }
@keyframes cab-blink { 50% { opacity: 0; } }

@container (max-width: 560px) {
  .cab-tiles { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .cab-tile { flex-direction: row; align-items: center; gap: 14px; text-align: left; font-size: 15px; }
  .cab-shot { flex: 0 0 42%; padding: 3px; border-width: 2px; }
  .cab-tile[aria-current="true"] .cab-shot { transform: translateX(4px); }
  .cab-hud-mid { display: none; }
  .cab-rec { text-align: left; }
}
@container (max-height: 360px) and (min-width: 561px) { .cab-desc { display: none; } .cab-info { min-height: 0; justify-content: flex-end; } }

/* jogo dentro do tubo: o nome já está no letreiro e as instruções vão impressas no painel,
   então o título e as dicas do jogo somem, e letreiro e painel encolhem para a tela crescer */
.cab-view > .cab-game { padding-block: 12px; }
.cab-view > .cab-game h1, .cab-view > .cab-game .hint { display: none; }
.cab.is-playing .cab-marquee { padding-block: 6px 8px; }
.cab.is-playing .cab-mq-title { font-size: clamp(24px, 3.4vw, 38px); }
.cab.is-playing .cab-mq-sub { display: block; margin-top: 4px; }
.cab.is-playing .cab-bezel { padding: 8px 12px; }
.cab.is-playing .cab-panel { padding-block: 8px 12px; }
.cab.is-playing .cab-stick { width: 84px; height: 84px; }
.cab.is-playing .cab-plate { inset: 14px; }
.cab.is-playing .cab-ball { width: 36px; height: 36px; margin: -24px 0 0 -18px; }
.cab.is-playing .cab-dir { width: 24px; height: 24px; font-size: 9px; }
.cab.is-playing .cab-cap { width: 48px; height: 48px; }
.cab.is-playing .cab-exit .cab-cap { width: 40px; height: 40px; }
.cab-decal.is-hint { font: 400 13px/1.9 var(--cab-font-ui); letter-spacing: 0; text-align: left; color: var(--cab-dim); max-width: 70ch; }
.cab-decal kbd { font: 700 11px/1 var(--cab-font-ui); color: var(--cab-phos); border: 1px solid currentColor; border-radius: 4px; padding: 2px 5px; }

/* painel de controle */
.cab-panel {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px 28px;
  margin: 14px -18px 0; padding: clamp(10px, 1.8vh, 18px) clamp(18px, 4vw, 44px) clamp(14px, 2.2vh, 22px);
  background: linear-gradient(180deg, #342b49 0%, var(--cab-body) 100%);
  border-top: 4px solid var(--cab-trim); border-radius: 16px 16px 0 0;
  box-shadow: 0 0 0 3px #07060a, 0 -14px 30px rgba(0, 0, 0, .4);
}
.cab-panel::before { /* decalque listrado do painel */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: repeating-linear-gradient(-55deg, rgba(255, 79, 139, 0) 0 22px, rgba(255, 79, 139, .07) 22px 26px, rgba(69, 212, 255, 0) 26px 34px, rgba(69, 212, 255, .06) 34px 37px);
}
.cab-stick { position: relative; width: 112px; height: 112px; flex: none; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center; }
.cab-plate { position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #241d33, #0b090f 70%); box-shadow: 0 0 0 2px #3f3555, inset 0 4px 10px rgba(0, 0, 0, .8); }
.cab-ball {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -30px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ff9c8f 0, var(--cab-red) 42%, #7d1010 100%);
  box-shadow: 0 10px 0 -2px #4d0b0b, 0 14px 16px rgba(0, 0, 0, .55);
  transform: translate(calc(var(--tx, 0) * 12px), calc(var(--ty, 0) * 12px)); transition: transform .07s;
  pointer-events: none;
}
.cab-ball::before { content: ""; position: absolute; left: 50%; top: 100%; width: 10px; height: 18px; margin-left: -5px; background: linear-gradient(90deg, #6d6a75, #cfcbd6, #6d6a75); }
.cab-dir {
  position: relative; z-index: 1; width: 30px; height: 30px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 0; background: rgba(255, 255, 255, .06); color: var(--cab-dim); font: 700 11px/1 var(--cab-font-pixel);
}
.cab-dir:hover { color: var(--cab-phos); background: rgba(255, 255, 255, .12); }
.cab-dir[data-dir="up"] { grid-area: 1 / 2; } .cab-dir[data-dir="left"] { grid-area: 2 / 1; }
.cab-dir[data-dir="right"] { grid-area: 2 / 3; } .cab-dir[data-dir="down"] { grid-area: 3 / 2; }
.cab-decal { position: relative; margin: 0; flex: 1; min-width: 0; text-align: center; font: 700 clamp(10px, 1.3vw, 13px)/1.6 var(--cab-font-pixel); letter-spacing: .16em; color: var(--cab-dim); }
.cab-decal b { color: var(--cab-phos); font-weight: 700; }
.cab-btns { position: relative; display: flex; align-items: flex-end; gap: clamp(16px, 3vw, 30px); }
.cab-btn { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 0; background: none; border: 0; cursor: pointer; color: var(--cab-phos); font: 700 12px/1 var(--cab-font-pixel); letter-spacing: .14em; }
.cab-cap {
  display: block; width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #ff9c8f 0, var(--cab-red) 46%, #8b1212 100%);
  box-shadow: 0 7px 0 #520b0b, 0 10px 14px rgba(0, 0, 0, .5), inset 0 -4px 8px rgba(0, 0, 0, .3);
  transition: transform .06s, box-shadow .06s;
}
.cab-exit .cab-cap { width: 44px; height: 44px; background: radial-gradient(circle at 36% 30%, #fff, var(--cab-grey) 46%, #77718a 100%); box-shadow: 0 6px 0 #48435a, 0 9px 12px rgba(0, 0, 0, .5), inset 0 -4px 8px rgba(0, 0, 0, .2); }
.cab-btn:active:not(:disabled) .cab-cap, .cab-btn.is-down .cab-cap { transform: translateY(5px); box-shadow: 0 2px 0 #520b0b, 0 3px 6px rgba(0, 0, 0, .5); }
.cab-exit:active:not(:disabled) .cab-cap { box-shadow: 0 1px 0 #48435a, 0 3px 6px rgba(0, 0, 0, .5); }
.cab-btn:disabled { cursor: default; opacity: .35; }
.cab-start:not(:disabled) .cab-cap { animation: cab-glow 1.1s steps(1) infinite; }
@keyframes cab-glow { 50% { background: radial-gradient(circle at 36% 30%, #ffd2c9 0, #ff5a4c 46%, #a51b1b 100%); } }
.cab-btn:focus { outline: none; }
.cab-btn:focus-visible .cab-cap, .cab-dir:focus-visible { outline: 2px dashed var(--cab-cool); outline-offset: 4px; }

/* celular: gabinete mais estreito, letreiro e painel compactos, sem a alavanca */
@media (max-width: 600px) {
  body { padding-inline: 8px; padding-block: 8px 0; }
  #app { min-height: 0; }
  .cab { border-width: 3px; border-radius: 16px 16px 0 0; }
  .cab-marquee { margin: 7px 7px 0; }
  .cab-bezel { margin: 8px 7px 0; padding: 6px; }
  .cab-view > .cab-game { padding-inline: 8px; }
  .cab-panel { margin-inline: -10px; padding-inline: 18px; }
  .cab-stick { display: none; }
  .cab-decal { text-align: left; }
}
@media (max-height: 760px) and (min-width: 601px) {
  .cab-mq-sub { display: none; }
  .cab-stick { width: 96px; height: 96px; }
  .cab-plate { inset: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .cab-press span, .cab-tile[aria-current="true"] .cab-tname::before, .cab-start:not(:disabled) .cab-cap { animation: none; }
  .cab-view.is-off, .cab-view.is-on { animation: none; }
  .cab-shot, .cab-ball { transition: none; }
}
</style>

<script>
// Fliperama: um gabinete com o menu na tela; o jogo escolhido é montado dentro do tubo e desmontado ao sair
const readNum = k => { try { return parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch (e) { return 0; } };
function seeded(a) { return () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; }; }

function thumbCobrinha(c) {
  const g = c.getContext('2d'), s = c.width / 16, rnd = seeded(7);
  for (let y = 0; y < 9; y++) for (let x = 0; x < 16; x++) { g.fillStyle = (x + y) % 2 ? '#6a9c3c' : '#72a642'; g.fillRect(x * s, y * s, s, s); }
  g.strokeStyle = 'rgba(40,90,20,.45)'; g.lineWidth = 2; g.lineCap = 'round';
  for (let i = 0; i < 220; i++) { const x = rnd() * c.width, y = rnd() * c.height; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 4, y - 5 - rnd() * 4); g.stroke(); }
  for (let i = 0; i < 9; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    g.fillStyle = '#fbfaf3'; for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(x + Math.cos(k) * 4, y + Math.sin(k) * 4, 2.6, 0, 7); g.fill(); }
    g.fillStyle = '#f0b51f'; g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill();
  }
  // maçã
  const ax = 12.6 * s, ay = 3.5 * s, ar = .34 * s;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(ax + 4, ay + 5, ar, ar * .85, 0, 0, 7); g.fill();
  const gr = g.createRadialGradient(ax - ar * .35, ay - ar * .35, 2, ax, ay, ar * 1.1);
  gr.addColorStop(0, '#ff8f6c'); gr.addColorStop(.4, '#df3329'); gr.addColorStop(1, '#8c1313');
  g.fillStyle = gr; g.beginPath(); g.arc(ax, ay, ar, 0, 7); g.fill();
  g.fillStyle = '#4f9a2e'; g.beginPath(); g.ellipse(ax + 6, ay - ar * .9, 8, 4, -.5, 0, 7); g.fill();
  // cobra-do-milho
  const pts = [[1.6, 6.6], [5.5, 6.6], [5.5, 4.6], [9.5, 4.6], [9.5, 3.5], [11.6, 3.5]].map(([x, y]) => [x * s, y * s]);
  const path = () => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.save(); g.translate(4, 6); path(); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = .6 * s; g.stroke(); g.restore();
  path(); g.strokeStyle = '#2c130a'; g.lineWidth = .66 * s; g.stroke();
  path(); g.strokeStyle = '#b2551f'; g.lineWidth = .58 * s; g.stroke();
  path(); g.strokeStyle = '#e08a3e'; g.lineWidth = .4 * s; g.stroke();
  path(); g.setLineDash([.24 * s, .64 * s]); g.lineCap = 'butt'; g.strokeStyle = '#a3341a'; g.lineWidth = .46 * s; g.stroke(); g.setLineDash([]);
  const [hx, hy] = pts[pts.length - 1];
  const ell = (x, y, rx, ry, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); };
  ell(hx + .06 * s, hy, .44 * s, .36 * s, '#2c130a'); ell(hx + .06 * s, hy, .41 * s, .33 * s, '#b2551f'); ell(hx + .09 * s, hy, .3 * s, .22 * s, '#e08a3e');
  for (const k of [-1, 1]) { ell(hx + .2 * s, hy + k * .2 * s, .075 * s, .075 * s, '#e0a634'); ell(hx + .21 * s, hy + k * .2 * s, .04 * s, .04 * s, '#120804'); }
  g.strokeStyle = '#cc2442'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(hx + .46 * s, hy); g.lineTo(hx + .72 * s, hy); g.lineTo(hx + .82 * s, hy - 6); g.moveTo(hx + .72 * s, hy); g.lineTo(hx + .82 * s, hy + 6); g.stroke();
}

function thumbPega(c) {
  const g = c.getContext('2d'), s = c.width / 16, E = .62 * s;
  g.fillStyle = '#bdb7ab'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(70,62,50,.22)'; g.lineWidth = 2; g.beginPath();
  for (let x = 4; x < 16; x += 4) { g.moveTo(x * s, 0); g.lineTo(x * s, c.height); }
  for (let y = 4; y < 9; y += 4) { g.moveTo(0, y * s); g.lineTo(c.width, y * s); }
  g.stroke();
  // cone de visão do pegador
  const sx = 12.6 * s, sy = 5.4 * s;
  const cg = g.createRadialGradient(sx, sy, 0, sx, sy, 8 * s);
  cg.addColorStop(0, 'rgba(255,214,90,.42)'); cg.addColorStop(1, 'rgba(255,214,90,0)');
  g.fillStyle = cg; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx - 8 * s, sy - 4.2 * s); g.lineTo(sx - 8 * s, sy + 3.6 * s); g.closePath(); g.fill();
  const crate = (x, y, w, h, base) => {
    const x0 = x * s, top = y * s - E - (base || 0), bot = (y + h) * s - E - (base || 0), gnd = (y + h) * s - (base || 0);
    if (!base) { g.fillStyle = 'rgba(35,28,18,.22)'; g.fillRect(x0 + .25 * s, y * s + .2 * s, w * s, h * s); }
    g.fillStyle = '#93622f'; g.fillRect(x0, bot, w * s, gnd - bot);
    g.fillStyle = '#c99459'; g.fillRect(x0, top, w * s, bot - top);
    g.strokeStyle = '#6b4320'; g.lineWidth = 2.5; g.strokeRect(x0 + 1, top + 1, w * s - 2, bot - top - 2);
    g.strokeStyle = 'rgba(95,60,25,.55)'; g.beginPath(); g.moveTo(x0 + 6, top + 6); g.lineTo(x0 + w * s - 6, bot - 6); g.stroke();
  };
  const fig = (x, y, shirt, seeker, carry) => {
    const px = x * s, py = y * s, u = s;
    g.fillStyle = 'rgba(30,25,15,.25)'; g.beginPath(); g.ellipse(px + 4, py + 3, .34 * u, .2 * u, 0, 0, 7); g.fill();
    g.fillStyle = seeker ? '#3b3030' : '#2e3a4c'; g.fillRect(px - .12 * u, py - .4 * E, .09 * u, .4 * E); g.fillRect(px + .03 * u, py - .4 * E, .09 * u, .4 * E);
    g.fillStyle = shirt; g.fillRect(px - .18 * u, py - .78 * E, .36 * u, .42 * E);
    g.strokeStyle = shirt; g.lineWidth = .09 * u; g.lineCap = 'round';
    g.beginPath();
    if (carry) { g.moveTo(px - .16 * u, py - .74 * E); g.lineTo(px - .16 * u, py - 1.05 * E); g.moveTo(px + .16 * u, py - .74 * E); g.lineTo(px + .16 * u, py - 1.05 * E); }
    else { g.moveTo(px - .22 * u, py - .72 * E); g.lineTo(px - .24 * u, py - .44 * E); g.moveTo(px + .22 * u, py - .72 * E); g.lineTo(px + .24 * u, py - .44 * E); }
    g.stroke();
    const hyy = py - .92 * E;
    g.fillStyle = seeker ? '#d9a27c' : '#f0c39b'; g.beginPath(); g.arc(px, hyy, .15 * u, 0, 7); g.fill();
    g.fillStyle = seeker ? '#b8322a' : '#6b4425'; g.beginPath(); g.arc(px, hyy - .03 * u, .155 * u, Math.PI, 2 * Math.PI); g.fill();
    if (seeker) { g.beginPath(); g.ellipse(px, hyy - .02 * u, .14 * u, .035 * u, 0, 0, 7); g.fill(); }
    g.fillStyle = '#1a1714'; g.beginPath(); g.arc(px - .055 * u, hyy + .02 * u, .02 * u, 0, 7); g.arc(px + .055 * u, hyy + .02 * u, .02 * u, 0, 7); g.fill();
    if (carry) crate(x - .5, y - .5, 1, 1, 1.05 * E);
  };
  // esconderijo em cata-vento e uma rampa
  crate(3, 3, 2, 1); crate(5, 3, 1, 2); crate(3, 4, 1, 2); crate(4, 5, 2, 1);
  const rx = 9.4 * s, ry = 1.6 * s;
  g.fillStyle = '#7d7466'; g.beginPath(); g.moveTo(rx, ry + s); g.lineTo(rx + 2 * s, ry + s); g.lineTo(rx + 2 * s, ry + s - E); g.closePath(); g.fill();
  const rg = g.createLinearGradient(rx, 0, rx + 2 * s, 0); rg.addColorStop(0, '#a99d86'); rg.addColorStop(1, '#ddd2b9');
  g.fillStyle = rg; g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + 2 * s, ry - E); g.lineTo(rx + 2 * s, ry + s - E); g.lineTo(rx, ry + s); g.closePath(); g.fill();
  g.strokeStyle = '#e0a21b'; g.lineWidth = 4; g.lineCap = 'round';
  for (const k of [.5, 1, 1.5]) { const x = rx + k * s, y = ry + .5 * s - k / 2 * E; g.beginPath(); g.moveTo(x - 6, y - 12); g.lineTo(x + 4, y); g.lineTo(x - 6, y + 12); g.stroke(); }
  crate(13, 7, 1, 1);
  fig(7.6, 6.4, '#2f86c9', false, true);
  fig(12.6, 5.4, '#d1463a', true, false);
}

function thumbAbismo(c) {
  const g = c.getContext('2d'), W = c.width, H = c.height, cx = W / 2, cy = H / 2;
  g.fillStyle = '#17181c'; g.fillRect(0, 0, W, cy);
  const fg = g.createLinearGradient(0, cy, 0, H); fg.addColorStop(0, '#141211'); fg.addColorStop(1, '#4a4440');
  g.fillStyle = fg; g.fillRect(0, cy, W, H - cy);
  const bx0 = cx - 80, bx1 = cx + 80, by0 = cy - 56, by1 = cy + 56;
  const wall = (pts, c1, c2, x0, x1) => {
    const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill();
  };
  wall([[0, -10], [bx0, by0], [bx0, by1], [0, H + 10]], '#6d7178', '#1e2024', 0, bx0);
  wall([[W, -10], [bx1, by0], [bx1, by1], [W, H + 10]], '#6d7178', '#1e2024', W, bx1);
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 3;
  for (const k of [.3, .55, .75, .88]) {
    for (const [ex, ey0, ey1, sx] of [[bx0, by0, by1, 0], [bx1, by0, by1, W]]) {
      const x = sx + (ex - sx) * k; g.beginPath(); g.moveTo(x, -10 + (ey0 + 10) * k); g.lineTo(x, H + 10 + (ey1 - H - 10) * k); g.stroke();
    }
  }
  g.fillStyle = 'rgba(236,234,214,.85)';
  for (const k of [.2, .45, .65, .8]) { const y = cy - (cy - 0) * (1 - k) * .9 - 6, w = 70 * (1 - k) + 10; g.fillRect(cx - w / 2, y, w, 6 * (1 - k) + 2); }
  // porta no fundo com faixa de atenção
  g.fillStyle = '#5e605c'; g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? '#d9a821' : '#1d1d1b'; g.beginPath(); const x = bx0 + i * 16; g.moveTo(x, cy - 8); g.lineTo(x + 16, cy - 8); g.lineTo(x + 8, cy + 8); g.lineTo(x - 8, cy + 8); g.fill(); }
  // criatura com bola de fogo
  const mx = cx + 40, my = cy + 40;
  g.fillStyle = '#5c2e1c'; g.fillRect(mx - 16, my - 10, 10, 34); g.fillRect(mx + 6, my - 10, 10, 34);
  g.fillStyle = '#b0603a'; g.beginPath(); g.ellipse(mx, my - 26, 22, 26, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(mx, my - 62, 13, 15, 0, 0, 7); g.fill();
  g.strokeStyle = '#e2d6b4'; g.lineWidth = 5; g.beginPath(); g.moveTo(mx - 9, my - 72); g.lineTo(mx - 18, my - 88); g.moveTo(mx + 9, my - 72); g.lineTo(mx + 18, my - 88); g.stroke();
  g.fillStyle = '#ff4630'; g.fillRect(mx - 7, my - 66, 4, 3); g.fillRect(mx + 3, my - 66, 4, 3);
  const fb = g.createRadialGradient(cx - 40, cy + 6, 2, cx - 40, cy + 6, 26); fb.addColorStop(0, '#fff6c8'); fb.addColorStop(.4, '#ffb03a'); fb.addColorStop(1, 'rgba(255,90,20,0)');
  g.fillStyle = fb; g.beginPath(); g.arc(cx - 40, cy + 6, 26, 0, 7); g.fill();
  // escopeta na mão
  const gx = cx, gy = H;
  const fl = g.createRadialGradient(gx, gy - 150, 4, gx, gy - 150, 40); fl.addColorStop(0, '#fffbe0'); fl.addColorStop(.5, '#ffb030'); fl.addColorStop(1, 'rgba(255,120,20,0)');
  g.fillStyle = fl; g.beginPath(); g.arc(gx, gy - 150, 40, 0, 7); g.fill();
  g.fillStyle = '#46484e'; g.fillRect(gx - 16, gy - 150, 32, 150);
  g.fillStyle = '#7c8088'; g.fillRect(gx - 14, gy - 150, 5, 150);
  g.fillStyle = '#1c1c20'; g.beginPath(); g.ellipse(gx - 7, gy - 148, 5, 3, 0, 0, 7); g.ellipse(gx + 7, gy - 148, 5, 3, 0, 0, 7); g.fill();
  g.fillStyle = '#78482a'; g.fillRect(gx - 26, gy - 92, 52, 26);
  g.fillStyle = '#d6a078'; g.beginPath(); g.ellipse(gx - 32, gy - 78, 16, 18, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(gx + 10, gy - 6, 40, 22, 0, 0, 7); g.fill();
}

const GAME_LIST = [
  { id: 'cobrinha', name: 'Cobrinha', mount: mountCobrinha, thumb: thumbCobrinha,
    desc: 'Coma maçãs no jardim, cresça e não bata em nada. Cinco modos de jogo e ciclo de dia e noite.',
    rec: () => ['Recorde no Clássico', String(readNum('cobrinha.best'))] },
  { id: 'pega-pega', name: 'Pega-pega', mount: mountPegaPega, thumb: thumbPega,
    desc: 'Um minuto para montar o esconderijo com caixas e rampas, um minuto para fugir do pegador.',
    rec: () => ['Você × pegador', readNum('pegapega.w') + ' × ' + readNum('pegapega.l')] },
  { id: 'abismo', name: 'Abismo', mount: mountAbismo, thumb: thumbAbismo,
    desc: 'Tiro em primeira pessoa numa estação tomada por criaturas. Ache os cartões, abra as portas e chegue à saída.',
    rec: () => { const b = readNum('abismo.best.normal'); return ['Melhor tempo no Normal', b ? Math.floor(b / 60) + ':' + String(b % 60).padStart(2, '0') : '--:--']; } }
];
const GAME_BY_ID = {};
GAME_LIST.forEach(g => { GAME_BY_ID[g.id] = g; });
const app = document.getElementById('app'), screenCss = document.getElementById('screen-css');
const coarseMq = matchMedia('(pointer: coarse)'), reduceMq = matchMedia('(prefers-reduced-motion: reduce)');
let current = null, sel = 0, busy = false;
try { sel = Math.min(GAME_LIST.length - 1, Math.max(0, parseInt(localStorage.getItem('fliperama.sel') || '0', 10) || 0)); } catch (e) {}

// carpete de salão de fliperama, desenhado uma vez e repetido no fundo
(function carpet() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 200;
    const g = c.getContext('2d'), rnd = seeded(11), cols = ['#ff4f8b', '#45d4ff', '#f5c518', '#9b6bff'];
    g.lineWidth = 2.5; g.lineCap = 'round';
    for (let i = 0; i < 26; i++) {
      const x = rnd() * 200, y = rnd() * 200, col = cols[i % 4], k = i % 3;
      g.strokeStyle = g.fillStyle = col; g.globalAlpha = .2;
      g.beginPath();
      if (k === 0) g.arc(x, y, 4 + rnd() * 6, 0, 7);
      else if (k === 1) { g.moveTo(x, y); for (let j = 1; j < 5; j++) g.lineTo(x + j * 6, y + (j % 2 ? -6 : 0)); }
      else { g.moveTo(x, y - 6); g.lineTo(x + 6, y + 5); g.lineTo(x - 6, y + 5); g.closePath(); }
      g.stroke();
    }
    document.documentElement.style.setProperty('--cab-carpet', 'url(' + c.toDataURL() + ')');
  } catch (e) {}
})();

// bipes curtos do menu
let sfxCtx = null;
function blip(notes) {
  try {
    sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = sfxCtx.currentTime;
    notes.forEach((f, i) => {
      const o = sfxCtx.createOscillator(), v = sfxCtx.createGain(), t = t0 + i * .07;
      o.type = 'square'; o.frequency.value = f;
      v.gain.setValueAtTime(.035, t); v.gain.exponentialRampToValueAtTime(.0001, t + .09);
      o.connect(v).connect(sfxCtx.destination); o.start(t); o.stop(t + .1);
    });
  } catch (e) {}
}

app.innerHTML =
  '<div class="cab">' +
    '<header class="cab-marquee"><div class="cab-mq-title" role="heading" aria-level="1">Fliperama</div><p class="cab-mq-sub" id="cab-sub"></p></header>' +
    '<div class="cab-bezel"><div class="cab-tube" id="cab-tube"><div class="cab-view" id="cab-view"></div><div class="cab-glass" aria-hidden="true"></div></div></div>' +
    '<div class="cab-panel">' +
      '<div class="cab-stick" role="group" aria-label="Alavanca"><span class="cab-plate" aria-hidden="true"></span><span class="cab-ball" id="cab-ball" aria-hidden="true"></span>' +
        [['up', '▲', 'Para cima'], ['left', '◀&#xFE0E;', 'Para a esquerda'], ['right', '▶&#xFE0E;', 'Para a direita'], ['down', '▼', 'Para baixo']]
          .map(([d, s, l]) => '<button type="button" class="cab-dir" tabindex="-1" data-dir="' + d + '" aria-label="' + l + '">' + s + '</button>').join('') +
      '</div>' +
      '<p class="cab-decal" id="cab-decal"></p>' +
      '<div class="cab-btns">' +
        '<button type="button" class="cab-btn cab-exit" id="cab-exit"><span class="cab-cap" aria-hidden="true"></span><span>Sair</span></button>' +
        '<button type="button" class="cab-btn cab-start" id="cab-start"><span class="cab-cap" aria-hidden="true"></span><span>Start</span></button>' +
      '</div>' +
    '</div>' +
  '</div>';
const cab = app.querySelector('.cab'), view = document.getElementById('cab-view'), tube = document.getElementById('cab-tube');
const subEl = document.getElementById('cab-sub'), decal = document.getElementById('cab-decal');
const startBtn = document.getElementById('cab-start'), exitBtn = document.getElementById('cab-exit'), ball = document.getElementById('cab-ball');

// desliga e liga o tubo entre o menu e o jogo
function crt(fn) {
  if (busy) return;
  if (reduceMq.matches) { fn(); return; }
  busy = true;
  view.classList.add('is-off');
  setTimeout(() => {
    view.classList.remove('is-off');
    fn();
    view.classList.add('is-on');
    setTimeout(() => { view.classList.remove('is-on'); busy = false; }, 340);
  }, 200);
}

function closeGame() {
  if (!current) return;
  try { current.inst.unmount(); } catch (e) {}
  current = null;
  screenCss.textContent = '';
}

function select(i, focus) {
  sel = (i + GAME_LIST.length) % GAME_LIST.length;
  try { localStorage.setItem('fliperama.sel', String(sel)); } catch (e) {}
  const g = GAME_LIST[sel], [k, v] = g.rec();
  view.querySelectorAll('.cab-tile').forEach((t, j) => t.setAttribute('aria-current', j === sel ? 'true' : 'false'));
  const d = view.querySelector('#cab-desc'); if (d) d.textContent = g.desc;
  const rk = view.querySelector('#cab-rec-k'); if (rk) rk.textContent = k;
  const rv = view.querySelector('#cab-rec-v'); if (rv) rv.textContent = v;
  if (focus) { const t = view.querySelectorAll('.cab-tile')[sel]; if (t) t.focus(); }
}

function showHub(focusId) {
  closeGame();
  tube.classList.remove('is-game');
  cab.classList.remove('is-playing'); decal.classList.remove('is-hint');
  if (focusId && GAME_BY_ID[focusId]) sel = GAME_LIST.indexOf(GAME_BY_ID[focusId]);
  view.scrollTop = 0;
  view.innerHTML =
    '<div class="cab-menu">' +
      '<div class="cab-hud"><span><b>' + GAME_LIST.length + '</b> jogos</span><span class="cab-hud-mid">Selecione o jogo</span><span>Jogo <b>livre</b></span></div>' +
      '<div class="cab-tiles">' + GAME_LIST.map((g, i) =>
        '<button type="button" class="cab-tile" data-i="' + i + '" aria-current="false">' +
        '<span class="cab-shot"><canvas width="256" height="144" data-thumb="' + g.id + '" aria-hidden="true"></canvas></span>' +
        '<span class="cab-tname">' + g.name + '</span></button>').join('') + '</div>' +
      '<div class="cab-info" aria-live="polite"><p class="cab-desc" id="cab-desc"></p><p class="cab-rec"><span id="cab-rec-k"></span><b id="cab-rec-v"></b></p></div>' +
      '<p class="cab-press"><span>' + (coarseMq.matches ? 'Toque em Start' : 'Aperte Start') + '</span></p>' +
      '<p class="cab-keys">' + (coarseMq.matches ? 'Toque num jogo para escolher' : '◀ ▶ escolhem · Enter joga') + '</p>' +
    '</div>';
  // miniaturas desenhadas grandes e reduzidas, para ficarem com cara de pixel
  const big = document.createElement('canvas'); big.width = 640; big.height = 360;
  view.querySelectorAll('canvas[data-thumb]').forEach(c => {
    try { big.getContext('2d').clearRect(0, 0, 640, 360); GAME_BY_ID[c.dataset.thumb].thumb(big); c.getContext('2d').drawImage(big, 0, 0, c.width, c.height); } catch (e) {}
  });
  view.querySelectorAll('.cab-tile').forEach(t => {
    const i = +t.dataset.i;
    t.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && i !== sel) { select(i); blip([660]); } });
    t.addEventListener('click', () => { if (i === sel) play(); else { select(i); blip([660]); } });
  });
  select(sel, !!focusId);
  subEl.textContent = GAME_LIST.length + ' jogos · jogo livre';
  decal.innerHTML = '<b>◀ ▶</b> escolhe o jogo · <b>Start</b> joga';
  startBtn.disabled = false; exitBtn.disabled = true;
}

function openGame(id, data) {
  const g = GAME_BY_ID[id];
  if (!g) { showHub(); return; }
  closeGame();
  screenCss.textContent = document.getElementById('css-' + id).content.querySelector('style').textContent;
  tube.classList.add('is-game');
  view.scrollTop = 0;
  view.innerHTML = '<div class="cab-game">' + document.getElementById('html-' + id).innerHTML + '</div>';
  current = { id, inst: g.mount(data) };
  const wrap = view.querySelector('.wrap'); if (wrap) fitObs.observe(wrap);
  subEl.textContent = 'Jogando: ' + g.name;
  // as dicas de controle do jogo vão para o painel
  const hints = Array.from(view.querySelectorAll('.hint'));
  decal.innerHTML = hints.length ? hints.map(h => '<span class="' + h.className.replace(/\bhint\b/, '').trim() + '">' + h.innerHTML + '</span>').join('') : '<b>Sair</b> volta para a escolha de jogos';
  decal.classList.toggle('is-hint', hints.length > 0);
  cab.classList.add('is-playing');
  startBtn.disabled = true; exitBtn.disabled = false;
  const stage = view.querySelector('.stage'); if (stage) stage.focus({ preventScroll: true });
}

function play() { if (!current) { blip([523, 659, 784, 1047]); crt(() => openGame(GAME_LIST[sel].id)); } }
function exit() { if (current) { const id = current.id; blip([784, 523]); crt(() => showHub(id)); } }

// o jogo ocupa a tela inteira do tubo: a largura da página do jogo é ajustada para a altura caber
function fitGame() {
  if (!current) return;
  const game = view.firstElementChild, wrap = game && game.querySelector('.wrap'), stage = wrap && wrap.querySelector('.stage');
  if (!stage || !stage.offsetHeight) return;
  const cs = getComputedStyle(game);
  const used = wrap.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const stageH = stage.offsetHeight + view.clientHeight - used;
  const w = Math.max(280, Math.floor(stageH * stage.offsetWidth / stage.offsetHeight));
  if (Math.abs(w - (parseFloat(wrap.style.maxWidth) || 0)) > 2) wrap.style.maxWidth = w + 'px';
}
let fitRaf = 0;
const fitObs = new ResizeObserver(() => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitGame); });
fitObs.observe(tube);

// a alavanca mexe junto com as setas, e no jogo os cliques nela viram setas
const DIR_KEY = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
const KEY_TILT = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
const tilt = (x, y) => { ball.style.setProperty('--tx', x); ball.style.setProperty('--ty', y); };
app.querySelectorAll('.cab-dir').forEach(b => {
  const code = DIR_KEY[b.dataset.dir], [tx, ty] = KEY_TILT[code];
  let held = false;
  const up = () => { if (!held) return; held = false; tilt(0, 0); if (current) window.dispatchEvent(new KeyboardEvent('keyup', { code, key: code })); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); held = true; tilt(tx, ty);
    if (current) window.dispatchEvent(new KeyboardEvent('keydown', { code, key: code }));
    else { select(sel + (tx || ty)); blip([660]); }
  });
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
startBtn.addEventListener('click', play);
exitBtn.addEventListener('click', exit);
addEventListener('keydown', e => {
  if (KEY_TILT[e.code]) tilt(...KEY_TILT[e.code]);
  if (current || busy || e.ctrlKey || e.metaKey || e.altKey) return;
  const onTile = e.target.classList && e.target.classList.contains('cab-tile');
  const free = onTile || !e.target.closest || !e.target.closest('button, a, input, select, textarea');
  if (!free) return;
  const step = { ArrowLeft: -1, ArrowUp: -1, KeyA: -1, KeyW: -1, ArrowRight: 1, ArrowDown: 1, KeyD: 1, KeyS: 1 }[e.code];
  if (step) { e.preventDefault(); select(sel + step, true); blip([660]); }
  else if ((e.code === 'Enter' || e.code === 'Space') && !onTile) { e.preventDefault(); play(); }
});
addEventListener('keyup', e => { if (KEY_TILT[e.code]) tilt(0, 0); });

window.claude?.hot?.snapshot?.(() => ({ game: current ? current.id : null, data: current ? current.inst.snapshot() : null }));
const startApp = d => { if (d && d.game && GAME_BY_ID[d.game]) openGame(d.game, d.data); else showHub(); };
window.claude?.hot?.ready ? window.claude.hot.ready(startApp) : startApp(window.claude?.hot?.data ?? {});
</script>
